<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif">
  <rect width="1000" height="560" fill="#f7f9fc"/>

  <!-- фон: рабочий стол -->
  <rect x="60" y="330" width="880" height="180" rx="18" fill="#e8eef6"/>
  <rect x="120" y="300" width="360" height="220" rx="12" fill="#fff" stroke="#cbd5e1" transform="rotate(-4 300 410)"/>
  <path d="M150 470 C 210 470, 230 350, 300 390 S 400 470, 450 370" fill="none" stroke="#2563eb" stroke-width="4" transform="rotate(-4 300 410)"/>
  <line x1="150" y1="420" x2="450" y2="420" stroke="#cbd5e1" transform="rotate(-4 300 410)"/>
  <rect x="560" y="360" width="220" height="160" rx="10" fill="#eff6ff" stroke="#bfdbfe" transform="rotate(3 670 440)"/>
  <rect x="585" y="388" width="120" height="10" rx="5" fill="#93c5fd" transform="rotate(3 670 440)"/>
  <rect x="585" y="414" width="160" height="8" rx="4" fill="#cbd5e1" transform="rotate(3 670 440)"/>
  <rect x="585" y="436" width="140" height="8" rx="4" fill="#cbd5e1" transform="rotate(3 670 440)"/>
  <rect x="820" y="380" width="90" height="140" rx="8" fill="#fff" stroke="#cbd5e1" transform="rotate(8 865 450)"/>

  <!-- карточки цикла -->
  <g>
    <rect x="90" y="60" width="190" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="122" cy="94" r="13" fill="#2563eb"/>
    <text x="122" y="99" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
    <text x="148" y="100" font-size="16" font-weight="bold" fill="#1e40af">Гипотеза</text>
    <rect x="112" y="124" width="140" height="8" rx="4" fill="#93c5fd"/>
    <rect x="112" y="142" width="110" height="8" rx="4" fill="#bfdbfe"/>

    <rect x="330" y="60" width="190" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="362" cy="94" r="13" fill="#16a34a"/>
    <text x="362" y="99" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
    <text x="388" y="100" font-size="16" font-weight="bold" fill="#166534">Эксперимент</text>
    <rect x="352" y="124" width="140" height="8" rx="4" fill="#86efac"/>
    <rect x="352" y="142" width="120" height="8" rx="4" fill="#bbf7d0"/>

    <rect x="570" y="60" width="190" height="110" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="602" cy="94" r="13" fill="#d97706"/>
    <text x="602" y="99" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
    <text x="628" y="100" font-size="16" font-weight="bold" fill="#92400e">Объяснение</text>
    <rect x="592" y="124" width="140" height="8" rx="4" fill="#fcd34d"/>
    <rect x="592" y="142" width="100" height="8" rx="4" fill="#fde68a"/>

    <rect x="810" y="60" width="160" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="842" cy="94" r="13" fill="#7c3aed"/>
    <text x="842" y="99" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text>
    <text x="868" y="100" font-size="16" font-weight="bold" fill="#5b21b6">Рефлексия</text>
    <rect x="832" y="124" width="110" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="832" y="142" width="90" height="8" rx="4" fill="#ddd6fe"/>
  </g>

  <!-- стрелки -->
  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <path d="M282 115 H325" marker-end="url(#ar)"/>
    <path d="M522 115 H565" marker-end="url(#ar)"/>
    <path d="M762 115 H805" marker-end="url(#ar)"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- нисходящая связь со столом -->
  <path d="M185 180 C 185 250, 300 250, 300 300" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M890 180 C 890 250, 670 250, 670 300" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
</svg>

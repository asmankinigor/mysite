<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, sans-serif">
  <rect width="700" height="300" fill="#f8fafc"/>
  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#172033">Уровни обратной связи</text>

  <rect x="60" y="50" width="580" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="75" font-size="15" font-weight="bold" fill="#1e40af">1. Сигнальный</text>
  <text x="90" y="97" font-size="13" fill="#334155">Указание на шаг, где возникло расхождение</text>

  <line x1="350" y1="114" x2="350" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="140" width="580" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="165" font-size="15" font-weight="bold" fill="#166534">2. Объясняющий</text>
  <text x="90" y="187" font-size="13" fill="#334155">Подсказка о применяемом свойстве или теореме</text>

  <line x1="350" y1="204" x2="350" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="230" width="580" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="90" y="255" font-size="15" font-weight="bold" fill="#92400e">3. Рефлексивный</text>
  <text x="90" y="277" font-size="13" fill="#334155">Предложение сравнить результат с исходной гипотезой</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>

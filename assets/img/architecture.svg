<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Arial, sans-serif">
  <rect width="760" height="330" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#172033">Трёхслойная архитектура MathVizor</text>

  <rect x="30" y="60" width="210" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Клиент</text>
  <text x="135" y="120" text-anchor="middle" font-size="14" fill="#1e3a8a">TypeScript · React</text>
  <text x="135" y="145" text-anchor="middle" font-size="14" fill="#1e3a8a">SVG · Canvas</text>
  <text x="135" y="180" text-anchor="middle" font-size="12" fill="#334155">Графики и рабочий лист</text>
  <text x="135" y="202" text-anchor="middle" font-size="12" fill="#334155">в браузере без установки ПО</text>

  <rect x="275" y="60" width="210" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Сервер</text>
  <text x="380" y="120" text-anchor="middle" font-size="14" fill="#14532d">Python · FastAPI</text>
  <text x="380" y="145" text-anchor="middle" font-size="14" fill="#14532d">SymPy</text>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#334155">Вычисления, задания,</text>
  <text x="380" y="202" text-anchor="middle" font-size="12" fill="#334155">аналитика</text>

  <rect x="520" y="60" width="210" height="180" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="625" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">Данные</text>
  <text x="625" y="120" text-anchor="middle" font-size="14" fill="#78350f">PostgreSQL</text>
  <text x="625" y="145" text-anchor="middle" font-size="14" fill="#78350f">Redis · Celery</text>
  <text x="625" y="180" text-anchor="middle" font-size="12" fill="#334155">Хранение, кэш,</text>
  <text x="625" y="202" text-anchor="middle" font-size="12" fill="#334155">фоновые задачи</text>

  <line x1="242" y1="150" x2="272" y2="150" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="487" y1="150" x2="517" y2="150" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="30" y="265" width="700" height="45" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="293" text-anchor="middle" font-size="14" fill="#4c1d95">Интеграции: LTI 1.3 · xAPI · WCAG 2.1 · развёртывание в Docker</text>
</svg>
